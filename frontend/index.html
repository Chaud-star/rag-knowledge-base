<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAG 知识库问答系统</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main>
        <h1>RAG 知识库问答系统</h1>

        <section>
            <h2>上传文档</h2>
            <input id="fileInput" type="file" accept=".pdf,.docx,.md,.txt">
            <button id="uploadBtn">上传</button>
            <p id="uploadMessage"></p>
        </section>

        <section>
            <h2>文档列表</h2>
            <button id="refreshBtn">刷新</button>
            <ul id="documentList"></ul>
        </section>

        <section>
            <h2>知识库问答</h2>
            <input id="questionInput" type="text" placeholder="请输入你的问题">
            <button id="askBtn">提问</button>
            <div id="answerBox"></div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>

</html>
